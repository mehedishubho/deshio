<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Deshio Platform mark: white disc, broken orange ring, navy D + orange P, growth bars -->
  <circle cx="90" cy="90" r="88" fill="#ffffff" />
  <path d="M50.5 158.4 A79 79 0 1 1 129.5 158.4" stroke="#ff5f09" stroke-width="10" stroke-linecap="round" fill="none" />
  <!-- Letter D (thick navy stroke, drawn as a ring shape) -->
  <path fill-rule="evenodd" clip-rule="evenodd" fill="#02254b"
    d="M50 52 h34 c26 0 42 15 42 38 s-16 38 -42 38 h-34 z
       M64 66 h20 c15 0 24 10 24 24 s-9 24 -24 24 h-20 z" />
  <!-- Growth bars inside the D -->
  <rect x="68" y="96" width="8" height="14" rx="2" fill="#ff5f09" />
  <rect x="80" y="88" width="8" height="22" rx="2" fill="#e8494b" />
  <rect x="92" y="80" width="8" height="30" rx="2" fill="#0b6bcb" />
  <!-- Letter P overlapping the D -->
  <path fill-rule="evenodd" clip-rule="evenodd" fill="#ff5f09"
    d="M104 58 h18 c17 0 26 9 26 21 s-9 21 -26 21 h-6 v26 h-12 z
       M116 72 h6 c7 0 11 3 11 7 s-4 7 -11 7 h-6 z" />
</svg>
